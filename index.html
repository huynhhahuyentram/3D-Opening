<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Opening Tool Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <canvas id="view"></canvas>

    <div class="panel">
        <div class="row">
            <div class="box">
                <h3>📐 Position</h3>
                <div class="input-list">
                    <div class="input-item">
                        <label>X [mm]</label>
                        <input id="px" type="number" value="0">
                    </div>
                    <div class="input-item">
                        <label>Y [mm]</label>
                        <input id="py" type="number" value="0">
                    </div>
                    <div class="input-item">
                        <label>Z [mm]</label>
                        <input id="pz" type="number" value="0">
                    </div>
                </div>
            </div>

            <div class="box">
                <h3>📏 Dimension</h3>
                <div class="input-list">
                    <div class="input-item">
                        <label>Length [mm]</label>
                        <input id="dx" type="number" value="0">
                    </div>
                    <div class="input-item">
                        <label>Width [mm]</label>
                        <input id="dy" type="number" value="0">
                    </div>
                    <div class="input-item">
                        <label>Height [mm]</label>
                        <input id="dz" type="number" value="0">
                    </div>
                </div>
            </div>
        </div>

        <div class="box">
            <h3>🔘 Corner Radius (mm)</h3>
            <div class="radius">
                <label>R1<input id="r1" type="number" value="150"></label>
                <label>R2<input id="r2" type="number" value="150"></label>
                <label>R3<input id="r3" type="number" value="150"></label>
                <label>R4<input id="r4" type="number" value="150"></label>
            </div>
        </div>

        <div class="box">
            <h3>🧭 Orientation</h3>
            <div class="ori">
                <button onclick="setOri('X')" id="ox">X</button>
                <button onclick="setOri('Y')" id="oy">Y</button>
                <button onclick="setOri('Z')" id="oz" class="active">Z</button>
            </div>
        </div>

        <div class="btns">
            <button class="export" onclick="saveFile()">📤 Export</button>
            <button class="voice" onclick="voice()" id="voiceBtn">🎤 Voice</button>
            <button class="reset" onclick="reset()">🔄 Reset</button>
            <button class="library" onclick="openLibraryModal()">📚 Library</button>
            <button class="help" onclick="help()">❓ Help</button>
        </div>

        <div id="chat"></div>
    </div>
</div>

<!-- DOCUMENT LIBRARY MODAL -->
<div id="libraryModal" class="modal-overlay">
    <div class="modal-content library-layout">
        <!-- Sidebar Navigation (Categories, Department, Tools) -->
        <aside class="library-sidebar">
            <div class="sidebar-header">
                <h2>📚 LIBRARY</h2>
            </div>
            
            <div class="sidebar-status status-alert">
                <span>✅ Loaded <strong id="docCount">0</strong> documents</span>
            </div>

            <div class="sidebar-scroll-area">
                <!-- CATEGORIES SECTION -->
                <div class="menu-group">
                    <div class="menu-title">📁 CATEGORIES</div>
                    <button class="menu-item active" data-filter="all" onclick="selectCategory('all', this)">
                        <span>📄 All Documents</span>
                        <span class="badge" id="count-all">0</span>
                    </button>
                    <button class="menu-item" data-filter="cat-rules" onclick="selectCategory('Rules & Standards', this)">
                        <span>📋 Rules & Standards</span>
                        <span class="badge" id="count-cat-rules">0</span>
                    </button>
                    <button class="menu-item" data-filter="cat-methods" onclick="selectCategory('Methods', this)">
                        <span>🔧 Methods</span>
                        <span class="badge" id="count-cat-methods">0</span>
                    </button>
                    <button class="menu-item" data-filter="cat-experience" onclick="selectCategory('Experience', this)">
                        <span>💡 Experience</span>
                        <span class="badge" id="count-cat-experience">0</span>
                    </button>
                    <button class="menu-item" data-filter="cat-others" onclick="selectCategory('Cat-Others', this)">
                        <span>📎 Others</span>
                        <span class="badge" id="count-cat-others">0</span>
                    </button>
                </div>

                <!-- BY DEPARTMENT SECTION -->
                <div class="menu-group">
                    <div class="menu-title">🏗️ BY DEPARTMENT</div>
                    <button class="menu-item" data-filter="dept-hull" onclick="selectDepartment('Hull', this)">
                        <span>🚢 Hull</span>
                        <span class="badge" id="count-dept-hull">0</span>
                    </button>
                    <button class="menu-item" data-filter="dept-piping" onclick="selectDepartment('Piping', this)">
                        <span>🔧 Piping</span>
                        <span class="badge" id="count-dept-piping">0</span>
                    </button>
                    <button class="menu-item" data-filter="dept-electrical" onclick="selectDepartment('Electrical', this)">
                        <span>⚡ Electrical</span>
                        <span class="badge" id="count-dept-electrical">0</span>
                    </button>
                    <button class="menu-item" data-filter="dept-outfitting" onclick="selectDepartment('Outfitting', this)">
                        <span>⚒️ Outfitting</span>
                        <span class="badge" id="count-dept-outfitting">0</span>
                    </button>
                    <button class="menu-item" data-filter="dept-others" onclick="selectDepartment('Dept-Others', this)">
                        <span>📎 Others</span>
                        <span class="badge" id="count-dept-others">0</span>
                    </button>
                </div>

                <!-- TOOLS SECTION -->
                <div class="menu-group">
                    <div class="menu-title">⚒️ TOOLS</div>
                    <a href="https://drive.google.com" target="_blank" class="tool-card">
                        <div class="tool-info">
                            <span class="tool-icon">🧊</span>
                            <div>
                                <strong>3D Opening Tool</strong>
                                <small>Click to download tool</small>
                            </div>
                        </div>
                        <span class="download-icon">⬇️</span>
                    </a>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="library-main">
            <!-- Header -->
            <div class="modal-header">
                <h2>Document List</h2>
                <button class="close-btn" onclick="closeLibraryModal()">&times;</button>
            </div>

            <!-- Search Bar Section -->
            <div class="search-section">
                <div class="search-controls">
                    <input type="text" id="searchInput" placeholder="Search by name or tags..." onkeyup="filterDocs()">
                    <div class="search-actions">
                        <button class="btn btn-cyan" onclick="startVoiceSearch()">🎤 Voice</button>
                        <button class="btn btn-purple" onclick="filterDocs()">🔍 Search</button>
                    </div>
                </div>
            </div>

            <!-- Add / Edit Document Form -->
            <div class="add-doc-form-wrapper">
                <input type="hidden" id="editingDocId" value="">
                <div class="form-row">
                    <input type="text" id="docNameInput" placeholder="Document name...">
                    <input type="text" id="docLinkInput" placeholder="Drive link...">
                    <input type="text" id="docTagsInput" placeholder="Tags (comma sepa)...">
                </div>
                <div class="form-row margin-top">
                    <select id="docCategorySelect" class="form-select">
                        <option value="Rules & Standards">📋 Rules & Standards</option>
                        <option value="Methods">🔧 Methods</option>
                        <option value="Experience">💡 Experience</option>
                        <option value="Cat-Others" selected>📎 Others (Category)</option>
                    </select>
                    <select id="docDepartmentSelect" class="form-select">
                        <option value="Hull">🚢 Hull</option>
                        <option value="Piping">🔧 Piping</option>
                        <option value="Electrical">⚡ Electrical</option>
                        <option value="Outfitting">⚒️ Outfitting</option>
                        <option value="Dept-Others" selected>📎 Others (Department)</option>
                    </select>
                    <div class="form-btn-group">
                        <button class="btn btn-purple" id="saveDocBtn" onclick="addDocument()">➕ Add</button>
                        <button class="btn btn-delete" id="cancelEditBtn" onclick="cancelEdit()" style="display: none;">✕ Cancel</button>
                    </div>
                </div>
            </div>

            <!-- Document List Box -->
            <div class="doc-list-wrapper">
                <div class="doc-list" id="docList">
                    <!-- Dynamic rendering -->
                </div>
            </div>

            <!-- Footer -->
            <div class="modal-footer">
                <button class="btn-text-close" onclick="closeLibraryModal()">Close</button>
            </div>
        </main>
    </div>
</div>

    
<!-- 1. KHỞI TẠO FIREBASE TRƯỚC -->

<!-- 2. NẠP FILE JS CỦA BẠN SAU CÙNG -->
<script src="script.js"></script>

</body>
</html>
</body>
</html>
