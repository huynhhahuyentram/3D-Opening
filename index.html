<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Opening & Cut Zone Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <!-- Màn hình Canvas 3D -->
    <canvas id="view"></canvas>

    <div class="panel">
        <!-- Bảng 2 cột: Position và Dimension -->
        <div class="row">
            <div class="box">
                <h3>Position (mm)</h3>
                <div class="input-grid">
                    <label>X <input id="px" type="number" value="0"></label>
                    <label>Y <input id="py" type="number" value="0"></label>
                    <label>Z <input id="pz" type="number" value="0"></label>
                </div>
            </div>

            <div class="box">
                <h3>Dimension (mm)</h3>
                <div class="input-grid">
                    <label>Length [mm] <input id="dx" type="number" value="0"></label>
                    <label>Width [mm] <input id="dy" type="number" value="0"></label>
                    <label>Height [mm] <input id="dz" type="number" value="0"></label>
                </div>
            </div>
        </div>

        <!-- Bo góc -->
        <div class="box">
            <h3>Corner Radius (mm)</h3>
            <div class="radius">
                <label>R1<input id="r1" type="number" value="150"></label>
                <label>R2<input id="r2" type="number" value="150"></label>
                <label>R3<input id="r3" type="number" value="150"></label>
                <label>R4<input id="r4" type="number" value="150"></label>
            </div>
        </div>

        <!-- Orientation: Mặt phẳng vuông góc với trục -->
        <div class="box">
            <h3>Orientation</h3>
            <div class="ori">
                <button onclick="setOri('X')" id="ox">X</button>
                <button onclick="setOri('Y')" id="oy">Y</button>
                <button onclick="setOri('Z')" id="oz" class="active">Z</button>
            </div>
        </div>

        <!-- Nút bấm chức năng -->
        <div class="btns">
            <button class="ok" onclick="saveFile()">OK (Export MAC)</button>
            <button class="voice" onclick="voice()">🎤 Voice</button>
            <button class="help" onclick="help()">Help</button>
            <button class="reset" onclick="reset()">Reset</button>
        </div>

        <div id="chat"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
