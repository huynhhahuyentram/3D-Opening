<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Real-time Macro Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>THÔNG SỐ LỖ MỞ</h2>
            
            <div class="section-title">Vị trí (Position)</div>
            <div class="input-group">
                <label>POS X:</label>
                <input type="number" id="px" value="51000">
                <label>Y:</label>
                <input type="number" id="py" value="-9747.5">
                <label>Z:</label>
                <input type="number" id="pz" value="8725">
            </div>

            <div class="section-title">Kích thước (Dimensions)</div>
            <div class="input-group">
                <label>Dài (L):</label>
                <input type="number" id="dx" value="2000">
            </div>
            <div class="input-group">
                <label>Rộng (W):</label>
                <input type="number" id="dy" value="1000">
            </div>
            <div class="input-group">
                <label>Cao (H):</label>
                <input type="number" id="dz" value="300">
            </div>

            <div class="section-title">Bán kính bo góc (Radius)</div>
            <div class="input-group gap">
                <input type="number" id="r1" value="150" placeholder="R1">
                <input type="number" id="r2" value="150" placeholder="R2">
                <input type="number" id="r3" value="150" placeholder="R3">
                <input type="number" id="r4" value="150" placeholder="R4">
            </div>

            <div class="section-title">Định hướng (Orientation)</div>
            <div class="ori">
                <button id="ox" onclick="setOri('X')">X (YOZ)</button>
                <button id="oy" onclick="setOri('Y')">Y (XOZ)</button>
                <button id="oz" class="active" onclick="setOri('Z')">Z (XOY)</button>
            </div>

            <div class="actions">
                <button class="btn-voice" onclick="voice()">🎤 Giọng nói</button>
                <button class="btn-save" onclick="saveFile()">💾 Xuất File .MAC</button>
                <button class="btn-reset" onclick="reset()">🔄 Đặt lại</button>
                <button class="btn-help" onclick="help()">❓ Trợ giúp</button>
            </div>
        </div>

        <div class="main-content">
            <div class="canvas-container">
                <canvas id="view"></canvas>
            </div>
            <div class="chat-container" id="chat">
                <div>🤖 Hệ thống đã sẵn sàng. Vui lòng nhập thông số hoặc bấm micro!</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
